services:
  postgres:
    image: postgres:16
    container_name: prod-postgres
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 針對 8GB RAM 的主機優化 PostgreSQL 參數
      # shared_buffers: 總 RAM 的 25% (2GB)
      # effective_cache_size: 總 RAM 的 50% (4GB)
      # maintenance_work_mem: 總 RAM 的 ~5% (512MB)
      # work_mem: (總 RAM - shared_buffers) / (max_connections * 3) 抓 16MB
      # wal_buffers: 16MB (固定建議值)
      POSTGRES_INITDB_ARGS: "-c shared_buffers=2GB -c effective_cache_size=4GB -c maintenance_work_mem=512MB -c work_mem=16MB -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c max_connections=200 -c random_page_cost=1.1"

    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    ports:
      - 5432:5432
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 3G
        reservations:
          cpus: '2'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - app-network
    restart: unless-stopped

  # 資料庫遷移服務 (一次性任務)
  migration:
    image: ${IMAGE_HUB_URL}/erp-migration:latest
    container_name: prod-migration
    env_file:
      - ./.env
    environment:
      CONNECTIONSTRINGS__DEFAULTCONNECTION: ${CONNECTIONSTRINGS__DEFAULTCONNECTION}
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: false
      TZ: Asia/Taipei

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./migration/logs:/app/logs

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    restart: "no"

  backend:
    image: ${IMAGE_HUB_URL}/erp-backend:latest
    container_name: erp-backend
    env_file:
      - ./.env
    ports:
      - "8080:8080"
    environment:
      # .NET 垃圾回收優化 (Server GC 對於多核/大內存主機效能更好)
      DOTNET_gcServer: 1
      # GC 記憶體保護，避免 OOM
      DOTNET_GCHeapHardLimitPercent: "80"
      # 執行緒池最小執行緒數優化
      DOTNET_ThreadPool_MinThreads: 100
      ASPNETCORE_ENVIRONMENT: Production
      CONNECTIONSTRINGS__DEFAULTCONNECTION: ${CONNECTIONSTRINGS__DEFAULTCONNECTION}
      JWTSETTINGS__SECRETKEY: ${JWTSETTINGS__SECRETKEY}
      JWTSETTINGS__ISSUER: ${JWTSETTINGS__ISSUER}
      JWTSETTINGS__AUDIENCE: ${JWTSETTINGS__AUDIENCE}
      JWTSETTINGS__EXPIRYMINUTES: ${JWTSETTINGS__EXPIRYMINUTES}
      EMAILSETTINGS__SMTPSERVER: ${EMAILSETTINGS__SMTPSERVER}
      EMAILSETTINGS__PORT: ${EMAILSETTINGS__PORT}
      EMAILSETTINGS__ENABLESSL: ${EMAILSETTINGS__ENABLESSL}
      EMAILSETTINGS__USERNAME: ${EMAILSETTINGS__USERNAME}
      EMAILSETTINGS__PASSWORD: ${EMAILSETTINGS__PASSWORD}
      EMAILSETTINGS__DEFAULTSENDER: ${EMAILSETTINGS__DEFAULTSENDER}
      EMAILSETTINGS__DEFAULTSENDERNAME: ${EMAILSETTINGS__DEFAULTSENDERNAME}
      CORS__ALLOWEDORIGINS: ${CORS__ALLOWEDORIGINS}
      FRONTENDHOMEURL: ${FRONTENDHOMEURL}
      MINIO__ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO__ACCESSKEY: ${MINIO_ROOT_USER:-rootuser}
      MINIO__SECRETKEY: ${MINIO_ROOT_PASSWORD:-change123}
      MINIO__BUCKET: ${MINIO_BUCKET:-erp-system}
      MINIO__USESSL: ${MINIO_USESSL:-false}
    volumes:
      - ./backend/temp:/app/temp
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 2.5G
        reservations:
          cpus: '2'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - app-network
    restart: unless-stopped

  # Minio 檔案存儲服務
  minio:
    image: minio/minio:latest
    container_name: prod-minio
    command: server /data --console-address ":9001"
    env_file:
      - ./.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rootuser}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change123}
      MINIO_API_REQUESTS_MAX: "2000"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./minio/data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  # React ERP Frontend 前端服務
  frontend:
    image: ${IMAGE_HUB_URL}/erp-frontend-react:${FRONTEND_IMAGE_TAG:-latest}
    container_name: erp-frontend-react-container
    env_file:
      - ./.env
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - NODE_ENV=production
      - TZ=Asia/Taipei
      - API_BASE_URL=http://backend:8080
    volumes:
      - ./frontend/nginx/logs:/var/log/nginx
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/healthz']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
