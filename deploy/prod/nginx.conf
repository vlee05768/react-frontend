# Vue ERP Frontend - Nginx 配置檔案
# 提供靜態檔案服務並透過 proxy 轉發 API 請求以避免 CORS 問題

# 上游後端 API 服務設定
# 注意：API_BASE_URL 環境變數將在 proxy_pass 中直接使用
# upstream backend_api {
#     # 後端 API 服務地址，可透過環境變數或 Docker Compose 設定
#     server backend:5160;
#
#     # 備用配置（可根據實際需求調整）
#     # server 192.168.1.100:5160 backup;
#
#     # 連接池設定
#     keepalive 32;
# }

# 主要伺服器配置
server {
    # 監聽埠（監聽所有來源的 80 port）
    listen 0.0.0.0:80;

    # 伺服器名稱（可根據實際域名調整）
    server_name localhost;

    # 預設編碼
    charset utf-8;

    # 檔案上傳大小限制（提高以支援大檔案上傳）
    client_max_body_size 500M;

    # 檔案傳輸超時設定
    client_body_timeout 300s;
    client_header_timeout 300s;
    send_timeout 300s;

    # 檔案上傳緩衝區設定（增加緩衝區大小以支援大檔案）
    client_body_buffer_size 512K;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # 根目錄設定（Vue 建置產出的靜態檔案）
    root /usr/share/nginx/html;
    index index.html index.htm;

    # 日誌設定
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip 壓縮設定
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/xml;

    # 安全標頭
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # API 代理設定 - 根據 Swagger 規格轉發 /api/v1/* 請求
    # 後端 API 基礎路徑為 /api/v1/，所有 API 請求應轉發到此路徑
    location /api/ {
        # 轉發到後端服務，保留原始路徑
        # 例如：/api/v1/Auth/login -> http://backend:5160/api/v1/Auth/login
        proxy_pass $API_BASE_URL;
        
        # 基本 proxy 標頭設定
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # WebSocket 支援（如果 API 需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 檔案傳輸優化設定
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;

        # 緩衝區設定（大檔案傳輸）
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 32 8k;
        proxy_busy_buffers_size 16k;

        # 檔案上傳流式處理
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
    }

    # Swagger 文檔代理
    # 根據 Swagger 規格，Swagger UI 和 JSON 檔案位於 /swagger/ 路徑下
    location /swagger/ {
        proxy_pass $API_BASE_URL;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Swagger UI 可能需要更長的超時時間
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # 檔案上傳 API（更寬鬆的限制）
    # 根據 Swagger 規格，檔案上傳可能在 /api/v1/FileAttachment/* 路徑下
    location ~ ^/api/v1/FileAttachment/(upload|batch-upload) {
        client_max_body_size 500M;
        proxy_read_timeout 600s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 600s;

        proxy_pass $API_BASE_URL;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 檔案上傳流式處理
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        
        # 專用日誌
        access_log /var/log/nginx/file_upload.log;
    }

    # 檔案下載 API（優化下載效能）
    # 根據 Swagger 規格，檔案下載可能在 /api/v1/FileAttachment/* 路徑下
    location ~ ^/api/v1/FileAttachment/(download|get) {
        proxy_buffering on;
        proxy_cache_valid 200 1h;

        proxy_pass $API_BASE_URL;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # 下載專用超時設定
        proxy_read_timeout 300s;
    }

    # Nginx 自身健康檢查端點
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 後端 API 健康檢查端點（代理到後端）
    location /healthz {
        proxy_pass $API_BASE_URL;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # 靜態檔案快取設定
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # HTML 檔案不快取
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }


    # 禁止直接存取上傳目錄
    location ~ ^/uploads/ {
        deny all;
        return 403;
    }

    # 檔案下載的安全標頭
    location ~* \.(pdf|doc|docx|xls|xlsx|zip|rar|csv)$ {
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
    }

    # Vue Router History Mode 支援
    # 所有找不到的路由都轉到 index.html，讓 Vue Router 處理
    location / {
        try_files $uri $uri/ /index.html;

        # 為 index.html 設定 no-cache
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # 錯誤頁面設定
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # 禁止訪問隱藏檔案
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止訪問備份檔案
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}